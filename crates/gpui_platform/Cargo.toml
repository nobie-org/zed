[package]
name = "gpui_platform"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_platform.rs"

[features]
default = []
font-kit = ["gpui_macos/font-kit"]
# Test-window capture uses the native wgpu renderer plus swash text system, so
# `gpui_wgpu` is compiled only under `test-support`.
test-support = [
    "gpui/test-support",
    "gpui_macos/test-support",
    "dep:gpui_wgpu",
    "gpui_wgpu/test-support",
]
screen-capture = ["gpui/screen-capture", "gpui_macos/screen-capture"]
runtime_shaders = ["gpui_macos/runtime_shaders"]
wayland = []
x11 = []

[dependencies]
gpui.workspace = true
gpui_wgpu = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos.workspace = true
